	      var psoriasis_count = 0;
        var eczema_count = 0;


        function psoriasisAdd(){
            psoriasis_count = psoriasis_count + 1;
        }

        function eczemaAdd(){
            eczema_count = eczema_count + 1;
        } 

	// this next function made to calculate and display results on the results page
	
	function showResults(){
		var total = eczema_count + psoriasis_count;
		var psoriasis_percent = psoriasis_count/total;
		var eczema_percent = eczema_count/total;
		
		var para=document.getElementById("res");
		resultText = "Possibility of Psoriasis is: " + psoriasis_percent*100 + "%<br> Possibility of Eczema is: " + eczema_percent*100 + "%<br>"
		para.innerHTML=resultText;
		return resultText;
	}
